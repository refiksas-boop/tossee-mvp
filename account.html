<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tossee – My Account</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #140D42 url("https://tossee.com/wp-content/uploads/2025/09/logo.png") no-repeat center top 40px;
      background-size: 280px;
      color: #fff;
      text-align: center;
    }
    .wrap {
      margin: 260px auto 60px;
      max-width: 480px;
    }
    h2 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 40px;
      background: linear-gradient(45deg,#a64dff,#00c6ff,#0072ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .menu a {
      display: block;
      margin: 15px 0;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      text-decoration: none;
      padding: 14px;
      border-radius: 8px;
      transition: background 0.3s, transform 0.2s;
      cursor: pointer;
    }
    .menu a:hover {
      background: linear-gradient(45deg,#a64dff,#00c6ff,#0072ff);
      transform: translateY(-2px);
    }

    /* === PHOTO MODAL === */
    #photoModal {
      display: none;
      position: fixed;
      z-index: 99999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
    }
    #photoModal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
    }
    #closePhotoModal {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 36px;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
    }

    /* Password modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 9999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      color: #000;
      padding: 30px;
      border-radius: 10px;
      width: 340px;
      text-align: left;
      position: relative;
    }
    .modal-content h3 {
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: #140D42;
    }
    .modal-content label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
      font-weight: bold;
      color: #140D42;
    }
    .modal-content input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }
    .modal-content button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      background: linear-gradient(45deg,#a64dff,#00c6ff,#0072ff);
      color: #fff;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.3s;
    }
    .modal-content button:hover {
      opacity: 0.9;
    }
    .close {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 28px;
      font-weight: bold;
      color: #999;
      cursor: pointer;
    }
    .close:hover {
      color: #000;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <h2>Welcome, <span id="username">...</span> 👋</h2>

    <div class="menu">
      <a href="/profile">View Profile</a>
      <a id="openPasswordModal">Change Password</a>
      <a id="registrationPhoto">Registration Photo</a>
    </div>
  </div>

  <!-- PASSWORD MODAL -->
  <div id="passwordModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <h3>Change Password</h3>

      <label>Current Password</label>
      <input type="password" id="currentPassword">

      <label>New Password</label>
      <input type="password" id="newPassword">

      <label>Confirm New Password</label>
      <input type="password" id="confirmPassword">

      <button onclick="savePassword()">Save</button>
    </div>
  </div>

  <!-- PHOTO MODAL -->
  <div id="photoModal">
    <span id="closePhotoModal">&times;</span>
    <img id="photoModalImg" src="" alt="Registration Photo">
  </div>

  <script>
    let CURRENT_USER_ID = null;

    // Load profile and display username
    fetch("/wp-json/tossee/v1/profile", {
      credentials: "include"
    })
    .then(r => {
      if (!r.ok) {
        console.error('Not logged in or session expired');
        return null;
      }
      return r.json();
    })
    .then(user => {
      if (user) {
        CURRENT_USER_ID = user.id;
        document.getElementById("username").textContent = user.username || "User";
      }
    })
    .catch(err => {
      console.error('Failed to load profile:', err);
    });

    // Open password modal
    const modal = document.getElementById("passwordModal");
    document.getElementById("openPasswordModal").onclick = () => {
      modal.style.display = "flex";
    };

    function closeModal() {
      modal.style.display = "none";
      // Clear inputs
      document.getElementById("currentPassword").value = "";
      document.getElementById("newPassword").value = "";
      document.getElementById("confirmPassword").value = "";
    }

    // Save password with API call
    async function savePassword() {
      const oldP = document.getElementById("currentPassword").value;
      const newP = document.getElementById("newPassword").value;
      const confirmP = document.getElementById("confirmPassword").value;

      // Validation
      if (!oldP || !newP || !confirmP) {
        alert("❌ All fields are required!");
        return;
      }

      if (newP !== confirmP) {
        alert("❌ New passwords do not match!");
        return;
      }

      if (newP.length < 6) {
        alert("❌ Password too short (min 6 characters).");
        return;
      }

      // API call to change password
      try {
        const response = await fetch("/wp-json/tossee/v1/change-password", {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            current_password: oldP,
            new_password: newP
          })
        });

        const result = await response.json();

        if (!response.ok) {
          // Handle errors
          if (result.code === 'wrong_password') {
            alert("❌ Current password is incorrect!");
          } else if (result.code === 'password_too_short') {
            alert("❌ Password too short (min 6 characters).");
          } else {
            alert("❌ Failed to change password: " + (result.message || 'Unknown error'));
          }
          return;
        }

        // Success
        alert("✅ Password changed successfully!");
        closeModal();
      } catch (err) {
        console.error('Error changing password:', err);
        alert("❌ Network error. Please try again.");
      }
    }

    // ================================
    //       PHOTO MODAL LOGIC
    // ================================
    const photoModal = document.getElementById("photoModal");
    const photoModalImg = document.getElementById("photoModalImg");

    document.getElementById("registrationPhoto").onclick = async () => {
      if (!CURRENT_USER_ID) {
        alert("Please wait, loading user data...");
        return;
      }

      try {
        // Fetch photo from API
        const response = await fetch("/wp-json/tossee/v1/photo", {
          credentials: "include"
        });

        if (!response.ok) {
          alert("Photo unavailable.");
          return;
        }

        const data = await response.json();

        if (data.photo) {
          // Photo is already base64 data URL, use it directly
          photoModalImg.src = data.photo;
          photoModal.style.display = "flex";
        } else {
          alert("Photo not found.");
        }
      } catch (err) {
        console.error('Error loading photo:', err);
        alert("Failed to load photo.");
      }
    };

    // Close photo modal
    document.getElementById("closePhotoModal").onclick = () => {
      photoModal.style.display = "none";
    };

    // Close modal on background click
    window.onclick = (e) => {
      if (e.target === photoModal) {
        photoModal.style.display = "none";
      }
      if (e.target === modal) {
        closeModal();
      }
    };
  </script>

</body>
</html>
