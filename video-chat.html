<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tossee Video Chat</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: white;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .video-container {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }
    video {
      width: 100%;
      max-width: 600px;
      background: #000;
      border-radius: 8px;
    }
    .controls {
      text-align: center;
    }
    .next-btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .next-btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tossee Video Chat</h1>
    <div class="video-container">
      <div>
        <h3>You</h3>
        <video id="localVideo" autoplay muted playsinline></video>
      </div>
      <div>
        <h3>Partner</h3>
        <video id="remoteVideo" autoplay playsinline></video>
      </div>
    </div>
    <div class="controls">
      <button class="next-btn">Next</button>
    </div>
  </div>

<script>
(() => {

  const remoteVideo = document.getElementById('remoteVideo');
  const localVideo  = document.getElementById('localVideo');
  const nextBtn     = document.querySelector('.next-btn');

  if (!remoteVideo || !localVideo || !nextBtn) {
    console.warn("WebRTC: elements missing");
    return;
  }

  // ==== USER ID from URL ====
  const params = new URLSearchParams(window.location.search);
  const userId = params.get("uid");

  // Jei nėra ID → žmogus neturėtų būti čia
  if (!userId) {
    alert("User not authorized. Missing uid.");
    window.location.href = "https://tossee.com/login";
    return;
  }

  window.tosseeUserId = userId;

  // ==== STATE ====
  let pc = null;
  let remoteStream = null;
  let currentRoomId = null;
  let pollingInterval = null;
  let matchingInterval = null;

  const rtcConfig = {
    iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
  };

  // ==== STATUS BOX ====
  function showStatus(text) {
    let box = document.getElementById("status-box");
    if (!box) {
      box = document.createElement("div");
      box.id = "status-box";
      box.style = `
        position: fixed;
        bottom: 80px;
        right: 16px;
        background: #2563eb;
        color: white;
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 14px;
        z-index: 9999;
      `;
      document.body.appendChild(box);
    }
    box.textContent = text;
    console.log("[STATUS]", text);
  }

  // ==== NEXT ====
  nextBtn.addEventListener("click", () => {
    console.log("[NEXT] clicked");

    // Stop any existing intervals
    if (matchingInterval) clearInterval(matchingInterval);
    if (pollingInterval) clearInterval(pollingInterval);

    if (pc) endCall();

    showStatus("Searching...");
    startRandomMatch();
  });

  // ================================================================
  // MATCHING - FIXED VERSION
  // ================================================================
  async function startRandomMatch() {
    try {
      const res = await fetch("https://n8n.tossee.com/webhook/next", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user: userId,
          action: "match"  // DODANO: aiškus action
        })
      });

      if (!res.ok) {
        throw new Error(`HTTP ${res.status}`);
      }

      const txt = await res.text();
      console.log("[NEXT] response:", txt);
      let data = JSON.parse(txt);

      if (data.status === "waiting") {
        showStatus("Waiting for partner...");
        // PATAISYTA: Greičiau tikrina (kas 1s vietoj 2s)
        if (!matchingInterval) {
          matchingInterval = setInterval(checkForMatch, 1000);
        }
        return;
      }

      if (data.status === "matched") {
        // Stop checking
        if (matchingInterval) {
          clearInterval(matchingInterval);
          matchingInterval = null;
        }

        currentRoomId = data.roomId;
        console.log("[MATCHED] room:", currentRoomId, data.users);
        showStatus("Partner found, connecting...");

        // PATAISYTA: Nustatom ar mes caller (pirmas user)
        const isCaller = data.users[0] === userId;
        await startWebRTC(isCaller);
      }

    } catch (err) {
      console.error("startRandomMatch() error:", err);
      showStatus("Network error. Retrying...");
      setTimeout(startRandomMatch, 3000);
    }
  }

  // ================================================================
  // CHECK FOR MATCH - Naujas metodas
  // ================================================================
  async function checkForMatch() {
    try {
      const res = await fetch("https://n8n.tossee.com/webhook/next", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user: userId,
          action: "check"  // Tiesiog tikrina ar yra match
        })
      });

      const txt = await res.text();
      let data = JSON.parse(txt);

      if (data.status === "matched") {
        // Stop checking
        if (matchingInterval) {
          clearInterval(matchingInterval);
          matchingInterval = null;
        }

        currentRoomId = data.roomId;
        console.log("[MATCHED] room:", currentRoomId, data.users);
        showStatus("Partner found, connecting...");

        const isCaller = data.users[0] === userId;
        await startWebRTC(isCaller);
      }

    } catch (err) {
      console.error("checkForMatch() error:", err);
    }
  }

  // ================================================================
  // WEBRTC START
  // ================================================================
  async function startWebRTC(isCaller) {
    console.log("[WebRTC] Starting as", isCaller ? "CALLER" : "ANSWERER");

    if (!window.localStream) {
      try {
        window.localStream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: true
        });
        localVideo.srcObject = window.localStream;
      } catch (err) {
        console.error("getUserMedia:", err);
        showStatus("Camera/Microphone error");
        return;
      }
    }

    pc = new RTCPeerConnection(rtcConfig);
    remoteStream = new MediaStream();
    remoteVideo.srcObject = remoteStream;

    window.localStream.getTracks().forEach(track => {
      pc.addTrack(track, window.localStream);
    });

    pc.ontrack = evt => {
      console.log("[WebRTC] Remote track received");
      evt.streams[0].getTracks().forEach(t => remoteStream.addTrack(t));
    };

    pc.onicecandidate = evt => {
      if (evt.candidate) {
        console.log("[WebRTC] ICE candidate");
        sendSignal("candidate", evt.candidate);
      }
    };

    pc.oniceconnectionstatechange = () => {
      console.log("[WebRTC] ICE state:", pc.iceConnectionState);
      if (pc.iceConnectionState === "connected") {
        showStatus("Connected!");
      } else if (pc.iceConnectionState === "failed" ||
                 pc.iceConnectionState === "disconnected") {
        showStatus("Connection lost");
      }
    };

    if (isCaller) {
      console.log("[WebRTC] Creating offer...");
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      await sendSignal("offer", offer);
    }

    // Start polling for signals
    pollSignals();
  }

  // ================================================================
  // SIGNALING SEND
  // ================================================================
  async function sendSignal(type, data) {
    if (!currentRoomId) {
      console.warn("sendSignal called without roomId");
      return;
    }
    try {
      await fetch("https://n8n.tossee.com/webhook/signal", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user: userId,
          roomId: currentRoomId,
          type,
          data
        })
      });
      console.log("[Signal] Sent:", type);
    } catch (e) {
      console.error("sendSignal:", e);
    }
  }

  // ================================================================
  // SIGNALING POLLING
  // ================================================================
  async function pollSignals() {
    if (!pc || !currentRoomId) return;

    try {
      const res = await fetch("https://n8n.tossee.com/webhook/signal", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          user: userId,
          roomId: currentRoomId,
          type: "check"
        })
      });

      const txt = await res.text();
      let data = JSON.parse(txt);

      const room = data.roomData || {
        offers: [],
        answers: [],
        candidates: []
      };

      // jei mes dar neturim remote SDP ir yra pasiūlymų – mes esam atsakantis
      if (!pc.currentRemoteDescription && room.offers.length) {
        console.log("[Signal] Received offer, creating answer...");
        const offer = room.offers.at(-1);
        await pc.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await sendSignal("answer", answer);
      }

      // jei jau esam davę offer ir atėjo answer
      if (room.answers.length && pc.signalingState === "have-local-offer") {
        console.log("[Signal] Received answer");
        const answer = room.answers.at(-1);
        await pc.setRemoteDescription(new RTCSessionDescription(answer));
      }

      // ICE kandidatai
      for (const c of room.candidates) {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(c));
        } catch (e) {
          console.warn("addIceCandidate error:", e);
        }
      }

    } catch (err) {
      console.error("pollSignals:", err);
    }

    // PATAISYTA: Greičiau polling (1s vietoj 1.5s)
    setTimeout(pollSignals, 1000);
  }

  // ================================================================
  // END CALL
  // ================================================================
  function endCall() {
    try {
      // PATAISYTA: Praneša serverui apie disconnect
      if (currentRoomId) {
        fetch("https://n8n.tossee.com/webhook/signal", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            user: userId,
            roomId: currentRoomId,
            type: "disconnect"
          })
        }).catch(e => console.error("disconnect signal failed:", e));
      }

      if (pc) {
        pc.ontrack = null;
        pc.onicecandidate = null;
        pc.close();
      }
    } catch (e) {
      console.error("endCall error:", e);
    }

    pc = null;
    currentRoomId = null;
    remoteVideo.srcObject = null;

    // Stop intervals
    if (pollingInterval) clearInterval(pollingInterval);
    if (matchingInterval) clearInterval(matchingInterval);
  }

  // Cleanup on page unload
  window.addEventListener('beforeunload', () => {
    endCall();
  });

})();
</script>
</body>
</html>
